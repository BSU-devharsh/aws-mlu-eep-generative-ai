# Jupyter Book configuration
# Docs: https://jupyterbook.org/customize/config.html

title: "Generative AI with Amazon Bedrock"
author: "Devharsh Trivedi, Ph.D., CISSP<br>Department of Computer Science<br>Bowie State University<br>ORCID 0000-0001-6374-7249"
logo: _static/MLU-NEW-logo.png
copyright: "2026"

# Short description used in social cards and metadata
description: >-
  An online textbook on Generative AI, Large Language Models, and building
  applications with Amazon Bedrock. Adapted from the AWS Machine Learning
  University Early Talent (EEP) Generative AI curriculum.

# Files present in the book tree but not part of the table of contents.
# These ship alongside the notebooks (READMEs, utilities, requirements) but are
# not standalone pages, so they are excluded from the build.
exclude_patterns:
  - "**/labs/**/README.md"
  - "**/labs/**/requirements.txt"
  - "**/labs/mlu_utils/**"
  - _build
  - Thumbs.db
  - .DS_Store
  - "**.ipynb_checkpoints"

# Do not execute the lab notebooks at build time.
# The labs require AWS credentials and Amazon Bedrock access, so they are
# rendered as-is rather than run on the build server.
execute:
  execute_notebooks: "off"
  timeout: 120
  allow_errors: true

# Parse and render settings
parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - substitution
    - tasklist

# Bibliography
bibtex_bibfiles:
  - references.bib

# HTML / theme options
html:
  favicon: _static/MLU-NEW-logo.png
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: false
  home_page_in_navbar: true
  baseurl: "/aws-mlu-eep-generative-ai/"
  extra_footer: |
    <div>
      Adapted from the AWS Machine Learning University Generative AI curriculum.
      <br>
      Course content licensed under the terms in the source repository.
    </div>

# Launch buttons (Binder / Colab) are disabled because the labs need
# Amazon Bedrock access that those services do not provide by default.
launch_buttons:
  notebook_interface: "classic"

repository:
  url: https://github.com/BSU-devharsh/aws-mlu-eep-generative-ai
  path_to_book: book
  branch: main

sphinx:
  extra_extensions:
    - notfound.extension
  config:
    html_show_copyright: true
    html_last_updated_fmt: "%b %d, %Y"
    bibtex_reference_style: author_year
    html_css_files:
      - custom.css
    # Custom 404 page (sphinx-notfound-page).
    # The prefix must match the GitHub Pages project subpath so the 404's own
    # assets and links resolve correctly when served from any URL depth.
    notfound_urls_prefix: "/aws-mlu-eep-generative-ai/"
    notfound_context:
      title: "Page Not Found (404)"
      body: |
        <h1>Page not found</h1>
        <p>Sorry, the page you were looking for does not exist. It may have been
        moved, renamed, or never existed. Here is where you can go next:</p>
        <p>
          <a class="nf-btn" href="/aws-mlu-eep-generative-ai/">📖 Book homepage</a>
          &nbsp;
          <a class="nf-btn" href="https://github.com/BSU-devharsh/aws-mlu-eep-generative-ai">💻 GitHub repository</a>
        </p>
        <p>You can also use the search box or the table of contents in the sidebar
        to find what you need.</p>
