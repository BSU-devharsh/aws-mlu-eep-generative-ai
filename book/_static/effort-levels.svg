<svg viewBox="0 0 920 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="efTitle efDesc" font-family="Helvetica, Arial, sans-serif">
  <title id="efTitle">What changes when you raise the effort level</title>
  <desc id="efDesc">Three rows show the same model answering the same prompt at low, medium and high or maximum effort. At low effort the model does little or no thinking and answers quickly. At medium effort it thinks a little and may call a tool once. At high or maximum effort it thinks at length, calls several tools, checks its own work and then answers. An arrow on the right shows that time to answer and tokens used, which count toward cost and usage limits, grow as effort rises. The figure is illustrative and not to scale.</desc>

  <defs>
    <marker id="efArrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1A5276"/>
    </marker>
    <marker id="efArrowAmber" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#A04000"/>
    </marker>
  </defs>

  <!-- legend -->
  <g font-size="12.5" fill="#1B2631">
    <rect x="20" y="18" width="18" height="18" rx="3" fill="#F5B041" stroke="#B9770E"/>
    <text x="46" y="32">Thinking (reasoning tokens)</text>
    <rect x="250" y="18" width="18" height="18" rx="3" fill="#48C9B0" stroke="#117A65"/>
    <text x="276" y="32">Tool call (search, code, file)</text>
    <rect x="478" y="18" width="18" height="18" rx="3" fill="#F1948A" stroke="#943126"/>
    <text x="504" y="32">Self-check</text>
    <rect x="610" y="18" width="18" height="18" rx="3" fill="#1A5276"/>
    <text x="636" y="32">Visible answer</text>
  </g>

  <!-- column headers -->
  <g font-size="13" font-weight="700" fill="#34495E">
    <text x="20"  y="78">Effort</text>
    <text x="150" y="78">Same model, same prompt: what happens before and during the answer</text>
  </g>
  <line x1="20" y1="88" x2="760" y2="88" stroke="#BDC3C7" stroke-width="1"/>

  <!-- Row 1: low -->
  <text x="20" y="138" font-size="15" font-weight="700" fill="#1B2631">Low</text>
  <text x="20" y="156" font-size="11.5" fill="#566573">quick replies</text>
  <rect x="150" y="116" width="70" height="40" rx="6" fill="#EAF2F8" stroke="#1A5276"/>
  <text x="185" y="141" text-anchor="middle" font-size="12" fill="#1B2631">Prompt</text>
  <line x1="222" y1="136" x2="246" y2="136" stroke="#1A5276" stroke-width="2" marker-end="url(#efArrow)"/>
  <rect x="252" y="122" width="22" height="28" rx="3" fill="#F5B041" stroke="#B9770E"/>
  <line x1="276" y1="136" x2="300" y2="136" stroke="#1A5276" stroke-width="2" marker-end="url(#efArrow)"/>
  <rect x="306" y="116" width="90" height="40" rx="6" fill="#1A5276"/>
  <text x="351" y="141" text-anchor="middle" font-size="12" fill="#FFFFFF">Answer</text>

  <!-- Row 2: medium -->
  <text x="20" y="248" font-size="15" font-weight="700" fill="#1B2631">Medium</text>
  <text x="20" y="266" font-size="11.5" fill="#566573">everyday work</text>
  <rect x="150" y="226" width="70" height="40" rx="6" fill="#EAF2F8" stroke="#1A5276"/>
  <text x="185" y="251" text-anchor="middle" font-size="12" fill="#1B2631">Prompt</text>
  <line x1="222" y1="246" x2="246" y2="246" stroke="#1A5276" stroke-width="2" marker-end="url(#efArrow)"/>
  <g fill="#F5B041" stroke="#B9770E">
    <rect x="252" y="232" width="22" height="28" rx="3"/>
    <rect x="278" y="232" width="22" height="28" rx="3"/>
    <rect x="304" y="232" width="22" height="28" rx="3"/>
  </g>
  <rect x="330" y="232" width="22" height="28" rx="3" fill="#48C9B0" stroke="#117A65"/>
  <rect x="356" y="232" width="22" height="28" rx="3" fill="#F5B041" stroke="#B9770E"/>
  <line x1="380" y1="246" x2="404" y2="246" stroke="#1A5276" stroke-width="2" marker-end="url(#efArrow)"/>
  <rect x="410" y="226" width="110" height="40" rx="6" fill="#1A5276"/>
  <text x="465" y="251" text-anchor="middle" font-size="12" fill="#FFFFFF">Answer</text>

  <!-- Row 3: high / max -->
  <text x="20" y="358" font-size="15" font-weight="700" fill="#1B2631">High / Max</text>
  <text x="20" y="376" font-size="11.5" fill="#566573">hard, high-stakes work</text>
  <rect x="150" y="336" width="70" height="40" rx="6" fill="#EAF2F8" stroke="#1A5276"/>
  <text x="185" y="361" text-anchor="middle" font-size="12" fill="#1B2631">Prompt</text>
  <line x1="222" y1="356" x2="246" y2="356" stroke="#1A5276" stroke-width="2" marker-end="url(#efArrow)"/>
  <g fill="#F5B041" stroke="#B9770E">
    <rect x="252" y="342" width="22" height="28" rx="3"/>
    <rect x="278" y="342" width="22" height="28" rx="3"/>
    <rect x="304" y="342" width="22" height="28" rx="3"/>
    <rect x="330" y="342" width="22" height="28" rx="3"/>
    <rect x="382" y="342" width="22" height="28" rx="3"/>
    <rect x="408" y="342" width="22" height="28" rx="3"/>
    <rect x="460" y="342" width="22" height="28" rx="3"/>
    <rect x="486" y="342" width="22" height="28" rx="3"/>
    <rect x="538" y="342" width="22" height="28" rx="3"/>
  </g>
  <g fill="#48C9B0" stroke="#117A65">
    <rect x="356" y="342" width="22" height="28" rx="3"/>
    <rect x="434" y="342" width="22" height="28" rx="3"/>
    <rect x="512" y="342" width="22" height="28" rx="3"/>
  </g>
  <rect x="564" y="342" width="22" height="28" rx="3" fill="#F1948A" stroke="#943126"/>
  <line x1="588" y1="356" x2="612" y2="356" stroke="#1A5276" stroke-width="2" marker-end="url(#efArrow)"/>
  <rect x="618" y="336" width="140" height="40" rx="6" fill="#1A5276"/>
  <text x="688" y="361" text-anchor="middle" font-size="12" fill="#FFFFFF">Answer</text>

  <!-- growth arrow on the right -->
  <line x1="815" y1="112" x2="815" y2="392" stroke="#A04000" stroke-width="3" marker-end="url(#efArrowAmber)"/>
  <g font-size="12" fill="#78281F" text-anchor="middle">
    <text x="815" y="104" font-weight="700">more effort</text>
    <text x="865" y="190">longer wait</text>
    <text x="865" y="230">more tokens</text>
    <text x="865" y="246">(cost and</text>
    <text x="865" y="262">usage limits)</text>
    <text x="865" y="302">more checking</text>
  </g>

  <!-- footnote -->
  <line x1="20" y1="410" x2="900" y2="410" stroke="#BDC3C7" stroke-width="1"/>
  <g font-size="12" fill="#34495E">
    <text x="20" y="432">Illustrative, not to scale. Effort changes how much work the model does on this request, not what it knows.</text>
    <text x="20" y="450">With adaptive thinking, a high setting on an easy question may still produce little or no thinking.</text>
  </g>
</svg>
