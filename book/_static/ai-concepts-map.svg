<svg viewBox="0 0 920 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="acTitle acDesc" font-family="Helvetica, Arial, sans-serif">
  <title id="acTitle">How AI, ML, deep learning, generative AI, LLMs and frontier models nest</title>
  <desc id="acDesc">Nested boxes from broadest to narrowest: artificial intelligence contains machine learning, which contains deep learning, which contains generative AI, which contains foundation models and large language models, which contain frontier models. A dashed band for natural language processing cuts across all layers. To the right, agentic AI is shown as a model placed in a loop with tools, and AGI and superintelligence are shown as hypothetical capability levels rather than techniques.</desc>

  <defs>
    <marker id="acArrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1A5276"/>
    </marker>
  </defs>

  <!-- nested layers, broadest first -->
  <rect x="20"  y="20"  width="610" height="600" rx="14" fill="#EAF2F8" stroke="#1A5276" stroke-width="2"/>
  <rect x="48"  y="88"  width="554" height="516" rx="12" fill="#D4E6F1" stroke="#1A5276" stroke-width="1.5"/>
  <rect x="76"  y="156" width="498" height="432" rx="12" fill="#A9CCE3" stroke="#1A5276" stroke-width="1.5"/>
  <rect x="104" y="224" width="442" height="348" rx="12" fill="#7FB3D5" stroke="#1A5276" stroke-width="1.5"/>
  <rect x="132" y="292" width="386" height="264" rx="12" fill="#2E86C1" stroke="#1A5276" stroke-width="1.5"/>
  <rect x="160" y="378" width="330" height="162" rx="12" fill="#1A5276" stroke="#0E3A57" stroke-width="1.5"/>

  <!-- NLP band cutting across every layer -->
  <rect x="452" y="34" width="150" height="570" rx="12" fill="#D68910" fill-opacity="0.13" stroke="#D68910" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="527" y="53" text-anchor="middle" font-size="14" font-weight="700" fill="#7E5109">NLP</text>
  <text x="527" y="68" text-anchor="middle" font-size="11" fill="#7E5109">natural language</text>
  <text x="527" y="81" text-anchor="middle" font-size="11" fill="#7E5109">processing</text>

  <!-- layer labels -->
  <g font-size="15" font-weight="700" fill="#0E3A57">
    <text x="38"  y="46">Artificial intelligence (AI)</text>
    <text x="66"  y="114">Machine learning (ML)</text>
    <text x="94"  y="182">Deep learning (DL)</text>
    <text x="122" y="250">Generative AI</text>
  </g>
  <g font-size="12" fill="#1B2631">
    <text x="38"  y="64">Any technique that makes machines perform tasks</text>
    <text x="38"  y="79">that need human-like intelligence</text>
    <text x="66"  y="132">Systems that learn patterns from data</text>
    <text x="66"  y="147">instead of following hand-written rules</text>
    <text x="94"  y="200">Neural networks with many layers</text>
    <text x="94"  y="215">that learn their own features</text>
    <text x="122" y="268">Models that create new text, images,</text>
    <text x="122" y="283">audio, video or code</text>
  </g>
  <text x="150" y="318" font-size="15" font-weight="700" fill="#FFFFFF">Foundation models and LLMs</text>
  <g font-size="12" fill="#FFFFFF">
    <text x="150" y="336">Pretrained on broad data, then adapted;</text>
    <text x="150" y="351">LLMs are the language-focused kind</text>
  </g>
  <text x="178" y="406" font-size="15" font-weight="700" fill="#FFFFFF">Frontier models</text>
  <g font-size="12" fill="#FFFFFF">
    <text x="178" y="426">The most capable models of the moment,</text>
    <text x="178" y="441">trained with the most compute</text>
    <text x="178" y="466" font-style="italic">Examples change every few months;</text>
    <text x="178" y="481" font-style="italic">see Part 2 of this chapter</text>
  </g>

  <!-- example strip for the outer layers -->
  <g font-size="11" fill="#34495E" font-style="italic">
    <text x="38"  y="612">e.g. route planning, chess engines, rule-based expert systems</text>
  </g>

  <!-- right column: how agents and AGI relate -->
  <rect x="660" y="34" width="245" height="172" rx="10" fill="#FFFFFF" stroke="#7F8C8D" stroke-width="1.2"/>
  <text x="674" y="58" font-size="14" font-weight="700" fill="#1B2631">How to read this map</text>
  <g font-size="12" fill="#1B2631">
    <text x="674" y="80">Each box sits inside a broader one:</text>
    <text x="674" y="96">every LLM is deep learning, every</text>
    <text x="674" y="112">deep-learning model is machine</text>
    <text x="674" y="128">learning, and so on.</text>
    <text x="674" y="152">The dashed NLP band cuts across</text>
    <text x="674" y="168">layers: language tasks can be done</text>
    <text x="674" y="184">with rules, classic ML, deep learning</text>
    <text x="674" y="200">or LLMs.</text>
  </g>

  <rect x="660" y="262" width="245" height="150" rx="10" fill="#E8F8F5" stroke="#117A65" stroke-width="1.6"/>
  <text x="674" y="288" font-size="14" font-weight="700" fill="#0B5345">Agentic AI</text>
  <g font-size="12" fill="#0B5345">
    <text x="674" y="310">A model placed in a loop: it plans,</text>
    <text x="674" y="326">calls tools (search, code, files,</text>
    <text x="674" y="342">apps), checks the results and</text>
    <text x="674" y="358">decides the next step. A way of</text>
    <text x="674" y="374">using models, not a new layer of</text>
    <text x="674" y="390">the map.</text>
  </g>
  <line x1="520" y1="420" x2="655" y2="350" stroke="#1A5276" stroke-width="2.2" marker-end="url(#acArrow)"/>

  <rect x="660" y="446" width="245" height="158" rx="10" fill="#FBEEE6" stroke="#A04000" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="674" y="472" font-size="14" font-weight="700" fill="#78281F">AGI and superintelligence</text>
  <g font-size="12" fill="#78281F">
    <text x="674" y="494">Hypothetical capability levels, not</text>
    <text x="674" y="510">techniques. AGI: human-level across</text>
    <text x="674" y="526">most intellectual tasks.</text>
    <text x="674" y="542">Superintelligence: far beyond the</text>
    <text x="674" y="558">best humans in nearly every field.</text>
    <text x="674" y="582" font-style="italic">No agreed test says either</text>
    <text x="674" y="597" font-style="italic">has been reached.</text>
  </g>
</svg>
