<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-labelledby="t d"><title id="t">Trusting a quantized model: rebuild it from the verified original</title><desc id="d">Download the lab&#x27;s signed original into a build environment and verify its Sigstore signature with model_signing. Record the hash of every file and store the verified files in a versioned S3 bucket that only the build role can write. For Bedrock, import the verified full-precision files with Custom Model Import, which does not take quantized models. For your own hardware, quantize in the same isolated build with a pinned tool, write a provenance record, evaluate against the original, and sign the result; deployment accepts only signed artifacts.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
