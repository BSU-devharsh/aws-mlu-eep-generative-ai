<g class="st s2"><rect x="295" y="70" width="245" height="220" rx="10" fill="#ffffff" stroke="#16a085" stroke-width="2.2" filter="url(#f-drop)"/><rect x="295" y="70" width="245" height="8" rx="4" fill="#16a085"/><use href="#i-group" x="377.5" y="84.0" width="80.0" height="80.0"/><text x="417.5" y="182.8" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#16a085" font-weight="bold" text-anchor="middle">Human</text><text x="417.5" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">your team or an AWS-</text><text x="417.5" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">managed work team</text></g>
<g class="st s2"><circle cx="309" cy="82" r="12" fill="#16a085" stroke="#fff" stroke-width="2"/><text x="309.0" y="86.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text></g>
<g class="st s3"><rect x="560" y="70" width="245" height="220" rx="10" fill="#ffffff" stroke="#6a3d9a" stroke-width="2.2" filter="url(#f-drop)"/><rect x="560" y="70" width="245" height="8" rx="4" fill="#6a3d9a"/><use href="#i-robot" x="642.5" y="84.0" width="80.0" height="80.0"/><text x="682.5" y="182.8" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6a3d9a" font-weight="bold" text-anchor="middle">LLM-as-a-judge</text><text x="682.5" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">correctness, faithfulness,</text><text x="682.5" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">harmfulness, custom rubric</text></g>
<g class="st s3"><circle cx="574" cy="82" r="12" fill="#6a3d9a" stroke="#fff" stroke-width="2"/><text x="574.0" y="86.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text></g>
<g class="st s4"><rect x="825" y="70" width="245" height="220" rx="10" fill="#ffffff" stroke="#d9822b" stroke-width="2.2" filter="url(#f-drop)"/><rect x="825" y="70" width="245" height="8" rx="4" fill="#d9822b"/><use href="#i-database" x="907.5" y="84.0" width="80.0" height="80.0"/><text x="947.5" y="182.8" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#d9822b" font-weight="bold" text-anchor="middle">RAG evaluation</text><text x="947.5" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">context relevance and</text><text x="947.5" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">coverage; citations</text></g>
<g class="st s4"><circle cx="839" cy="82" r="12" fill="#d9822b" stroke="#fff" stroke-width="2"/><text x="839.0" y="86.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text></g>
<g class="st s5"><rect x="30.0" y="320.0" width="1040.0" height="130.0" rx="8" fill="#fff8e1" fill-opacity="1" stroke="#d9a400" stroke-width="1.6"/></g>
<g class="st s5"><use href="#i-warning" x="52.0" y="352.0" width="36" height="36"/></g>
<g class="st s5"><circle cx="30" cy="320" r="12" fill="#d9822b" stroke="#fff" stroke-width="2"/><text x="30.0" y="324.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text></g>
<g class="st s5"><text x="104.0" y="350.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="start">A judge is a model with biases: it favors the answer shown first, longer answers, and its own family&#x27;s answers.</text></g>
<g class="st s5"><text x="104.0" y="376.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">Swap answer order between runs, use a judge from a different model family, and validate its scores</text></g>
<g class="st s5"><text x="104.0" y="396.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">against a sample of human ratings before relying on them.</text></g>
<g class="st s5"><text x="104.0" y="426.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" font-weight="normal" text-anchor="start" font-style="italic">LLM-as-a-judge and RAG evaluation became generally available on March 20, 2025.</text></g>
