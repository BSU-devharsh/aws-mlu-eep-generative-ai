<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" role="img" aria-labelledby="t d"><title id="t">Four ways to evaluate on Amazon Bedrock</title><desc id="d">Programmatic evaluation picks a model, a task type, metrics such as accuracy, robustness, and toxicity, and a dataset. Human evaluation compares up to two models with your own team or an AWS-managed team. LLM-as-a-judge uses a judge model to score correctness, completeness, faithfulness, and responsible AI metrics. RAG evaluation scores retrieval relevance and coverage, and generation faithfulness and citations. A judge has biases: position, verbosity, and self-enhancement.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
