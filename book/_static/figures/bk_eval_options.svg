<text x="550.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" font-weight="bold" text-anchor="middle">Four ways to evaluate on Amazon Bedrock</text>
<g class="st s1"><rect x="30" y="70" width="245" height="220" rx="10" fill="#ffffff" stroke="#1f4e9c" stroke-width="2.2" filter="url(#f-drop)"/><rect x="30" y="70" width="245" height="8" rx="4" fill="#1f4e9c"/><use href="#i-checklist" x="112.5" y="84.0" width="80.0" height="80.0"/><text x="152.5" y="182.8" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f4e9c" font-weight="bold" text-anchor="middle">Programmatic</text><text x="152.5" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">accuracy, robustness,</text><text x="152.5" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="middle">toxicity on a dataset</text></g>
