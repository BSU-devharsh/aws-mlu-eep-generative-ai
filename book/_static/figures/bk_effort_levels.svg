<g class="st s5"><text x="550.0" y="400.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#52606d" font-weight="normal" text-anchor="middle" font-style="italic">Illustrative, not to scale. Effort changes how much work the model does on this request, not what it knows.</text></g>
