<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" role="img" aria-labelledby="t d"><title id="t">What changes when you raise the effort level</title><desc id="d">The same model answers the same prompt at three settings. Low effort: one short thinking step before the answer. Medium: a few thinking steps and one tool call. High or maximum: many thinking steps, several tool calls, and a self-check before a longer answer. Waiting time, tokens used, and checking all grow with effort. Illustrative, not to scale.</desc>
