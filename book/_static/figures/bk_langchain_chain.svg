<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-labelledby="t d"><title id="t">A LangChain chain written with LCEL, and the memory that carries context between calls</title><desc id="d">The top row is the chain prompt_template piped into llm piped into StrOutputParser. Input variables, content type bedtime story and topic a cat, fill the prompt template to make the prompt, tell me a bedtime story about a cat. A chat model on Amazon Bedrock generates a reply, and the output parser turns it into a plain string. The bottom row shows memory. Before a call, the application retrieves the conversation history from memory and adds it to the prompt. After the call, it writes the new exchange back to memory, so the next call knows what came before.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
