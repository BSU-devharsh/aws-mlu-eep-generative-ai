<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" role="img" aria-labelledby="t d"><title id="t">Guardrails sit between users and the model, on the way in and on the way out</title><desc id="d">A user prompt passes an input guardrail before it reaches the model, and the model&#x27;s response passes an output guardrail before it reaches the user. Amazon Bedrock Guardrails applies denied topics, content filters, word filters, and sensitive information filters for PII the same way across models. Three implementation styles: keyword-based, metric-based with a classifier and a threshold, and LLM-based with a helper model judging intent. A blocked request gets a refusal or a safer response.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
