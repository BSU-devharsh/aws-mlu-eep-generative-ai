<rect width="1100" height="460" fill="#ffffff"/>
<text x="550.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" font-weight="bold" text-anchor="middle">Content Credentials: a signed record that must survive every step of your pipeline</text>
<g class="st s1"><use href="#i-eye" x="75.0" y="135.0" width="70" height="70"/><text x="110.0" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="middle">Capture or edit</text><text x="110.0" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" font-weight="normal" text-anchor="middle">C2PA manifest signed</text></g>
<g class="st s1"><circle cx="64" cy="120" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="64.0" y="124.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text></g>
<g class="st s2"><path d="M156.0 170.0 L344.0 170.0" fill="none" stroke="#1f4e9c" stroke-width="2.4" marker-end="url(#a-1f4e9c)" stroke-linejoin="round"/></g>
<g class="st s2"><use href="#i-document" x="355.0" y="135.0" width="70" height="70"/><text x="390.0" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="middle">Signed JPEG</text><text x="390.0" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" font-weight="normal" text-anchor="middle">manifest in APP11</text></g>
<g class="st s2"><circle cx="344" cy="120" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="344.0" y="124.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text></g>
<g class="st s3"><path d="M436.0 170.0 L624.0 170.0" fill="none" stroke="#1f4e9c" stroke-width="2.4" marker-end="url(#a-1f4e9c)" stroke-linejoin="round"/></g>
<g class="st s3"><use href="#i-gear" x="635.0" y="135.0" width="70" height="70"/><text x="670.0" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="middle">Resize for a thumbnail</text><text x="670.0" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" font-weight="normal" text-anchor="middle">ordinary image code</text></g>
<g class="st s3"><circle cx="624" cy="120" r="12" fill="#d9822b" stroke="#fff" stroke-width="2"/><text x="624.0" y="124.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text></g>
<g class="st s4"><path d="M716.0 170.0 L904.0 170.0" fill="none" stroke="#d9822b" stroke-width="2.4" marker-end="url(#a-d9822b)" stroke-linejoin="round"/></g>
<g class="st s4"><use href="#i-browser" x="915.0" y="135.0" width="70" height="70"/><text x="950.0" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="bold" text-anchor="middle">Published image</text><text x="950.0" y="235.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#52606d" font-weight="normal" text-anchor="middle">credential gone</text></g>
<g class="st s4"><circle cx="904" cy="120" r="12" fill="#c0392b" stroke="#fff" stroke-width="2"/><text x="904.0" y="124.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text></g>
<g class="st s2"><use href="#i-certificate" x="404.0" y="104.0" width="32" height="32"/></g>
<g class="st s4"><use href="#i-cross" x="937.0" y="107.0" width="26" height="26"/></g>
<g class="st s3"><text x="660.0" y="250.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="middle">APP11 segments dropped silently</text></g>
<g class="st s5"><rect x="40.0" y="300.0" width="1020.0" height="120.0" rx="8" fill="#e8f5e9" fill-opacity="1" stroke="#2e7d32" stroke-width="1.6"/></g>
<g class="st s5"><circle cx="40" cy="300" r="12" fill="#2e7d32" stroke="#fff" stroke-width="2"/><text x="40.0" y="304.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text></g>
<g class="st s5"><use href="#i-shield" x="60.0" y="340.0" width="40" height="40"/></g>
<g class="st s5"><text x="110.0" y="334.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" font-weight="bold" text-anchor="start">Test every step that touches an image, from upload to the content delivery network, then:</text></g>
<g class="st s5"><text x="130.0" y="360.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">- keep the credential through the step,</text></g>
<g class="st s5"><text x="130.0" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">- re-sign the result with your own certificate, or</text></g>
<g class="st s5"><text x="130.0" y="400.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">- use a service that preserves Content Credentials.</text></g>
</svg>