<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" role="img" aria-labelledby="t d"><title id="t">Chain-of-thought, self-consistency, and tree-of-thought on the same question</title><desc id="d">Three panels answer the question, when I was 16 my sister was half my age, now I am 42, how old is my sister. In the chain-of-thought panel the model reasons in one line, sister was 8, the gap is 8 years, 42 minus 8 is 34. In the self-consistency panel the model samples three reasoning paths that answer 34, 34, and 21, and a majority vote picks 34. In the tree-of-thought panel the model proposes several partial thoughts, rates each one, prunes the weak ones, expands the most promising, and backtracks when a branch fails, before choosing a final answer.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
