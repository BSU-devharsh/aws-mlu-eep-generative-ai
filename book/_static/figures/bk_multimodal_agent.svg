<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 440" width="1180" height="440" role="img" aria-labelledby="t d"><title id="t">A multimodal agent that looks at a photo, retrieves the manual, and walks the user through a fix</title><desc id="d">A user sends a photo of a broken device and asks how to fix it. The agent reasons about the request with the ReAct pattern. It calls an image tool, a multimodal model that describes what the photo shows, and a retrieval tool that searches a knowledge base of manuals with multimodal embeddings and returns the matching manual page. The agent reasons over both results and answers with step-by-step instructions.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
