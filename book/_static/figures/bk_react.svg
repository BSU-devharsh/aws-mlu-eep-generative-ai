<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d"><title id="t">ReAct: reason, act, observe, until the task is done</title><desc id="d">An agent receives a task and loops. It reasons with chain of thought to plan the next step, acts by calling a tool such as a knowledge base, a calculator, a weather API, or a search, observes the result, and feeds it back into its reasoning. The loop ends with an answer when the task is done.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
