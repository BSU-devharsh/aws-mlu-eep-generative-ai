<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 350" width="1180" height="350" role="img" aria-labelledby="t d"><title id="t">Seven steps that make an assistant do the heavy lifting</title><desc id="d">Seven cards in a row. Steps 1 to 3 set up the assistant: get a capable assistant, write a master prompt with your context, and build system prompts that hold your formulas. Steps 4 to 6 make the setup persistent: use project folders for lasting context, set custom instructions as your defaults, and turn a workflow into a custom assistant. Step 7 uses AI to improve the setup, and an arrow loops from it back to steps 2 to 6.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
