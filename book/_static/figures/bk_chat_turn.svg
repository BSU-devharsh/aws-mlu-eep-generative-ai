<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-labelledby="t d"><title id="t">One chatbot turn with a response cache, conversation memory, and prompt caching</title><desc id="d">A user message first goes to a response cache. On a hit, which suits deterministic questions, the cached answer returns at once. On a miss, the application builds the prompt from a long system prompt marked as a cached prefix, the recent conversation held in memory, either the last k turns or a running summary, and the new message. The Bedrock Converse API returns the reply, reading the cached prefix more cheaply. The application then writes the exchange to memory and stores the reply in the cache with an expiry time.</desc>
