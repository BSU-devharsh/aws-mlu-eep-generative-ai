<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 490" width="1180" height="490" role="img" aria-labelledby="t d"><title id="t">The NIST AI Risk Management Framework, Govern across Map, Measure, and Manage</title><desc id="d">Govern sits in the center as a culture of risk management, with policies, accountability, roles, and oversight that cut across the other three functions. Around it, Map establishes the context and identifies risks, Measure analyzes, assesses, and tracks those risks with quantitative and qualitative methods, and Manage prioritizes and acts on them with mitigations such as guardrails and oversight, and monitors over time. Arrows run from Map to Measure to Manage and back to Map, because the cycle repeats as the system and its risks change.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
