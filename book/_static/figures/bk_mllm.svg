<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" width="1180" height="460" role="img" aria-labelledby="t d"><title id="t">A multimodal LLM keeps a language model at its core and adds encoders for other inputs</title><desc id="d">On the left are three non-text inputs, an image, a video, and an audio clip. Each goes through its own encoder, a vision encoder, a video encoder, and an audio encoder, and an adapter maps the result into embeddings that the language model already works with. The text prompt is split into tokens and embedded the same way. The language model at the center attends over all of these embeddings together and generates a text answer.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
