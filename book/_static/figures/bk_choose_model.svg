<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Choosing a model and effort level, step by step</title><desc id="d">Five steps: match the modality, text, image, or audio; match difficulty to effort, starting low and raising it if needed; weigh cost and context, since a smaller model is often enough; respect privacy and compliance, using an enterprise tier or Amazon Bedrock for regulated data; then test and iterate on your own examples before deploying. If the model makes reasoning errors, loop back and raise the effort.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
