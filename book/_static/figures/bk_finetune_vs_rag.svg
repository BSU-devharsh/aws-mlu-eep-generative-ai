<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" role="img" aria-labelledby="t d"><title id="t">Fine-tuning changes the model; RAG changes what the model sees</title><desc id="d">Left: fine-tuning continues training on roughly 100 to 1,000 high-quality examples, updating the weights to create a new, specialized model; it suits knowledge that changes about yearly and needs re-evaluation for drift. Right: RAG leaves the weights alone and retrieves current data into the prompt at question time; it suits fast-changing information such as stock prices.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
