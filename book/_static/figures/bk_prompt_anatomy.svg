<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-labelledby="t d"><title id="t">The parts of a prompt and the knobs that shape the response</title><desc id="d">On the left, a prompt is built from four parts. The context says the text is a customer email received last week. The instruction asks the model to summarize the main points. The input is the body of the email. The output format asks for a bulleted list. The prompt goes to a language model whose inference parameters, temperature, top-p, and maximum tokens, shape how it generates. The response on the right is a short bulleted list of the email&#x27;s main points.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
