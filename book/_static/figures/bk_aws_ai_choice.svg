<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-labelledby="t d"><title id="t">Which AWS AI service fits the job, a ready-made service, a foundation model, or your own model</title><desc id="d">A decision flow. Start with your task and ask whether a ready-made AI service does this exact job. If yes, use a task-specific service such as Amazon Kendra, Lex, Comprehend, Transcribe, Polly, Textract, or Translate, which need no training. If no, ask whether a pre-trained foundation model can do it with prompting or fine-tuning. If yes, use Amazon Bedrock, which offers foundation models from many providers through one API. If no, use Amazon SageMaker AI to build, train, and deploy your own model, starting from built-in algorithms. Control and effort grow from the top option to the bottom one.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
