<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="1100" height="540" role="img" aria-labelledby="t d"><title id="t">Tool use with the Converse API: the model proposes, your code decides</title><desc id="d">Your application sends the conversation and tool definitions to Amazon Bedrock. If the model needs a tool, the response&#x27;s stopReason is tool_use with a toolUse block naming the tool and its input. Your code checks the tool is one you offered and the input is valid, runs it, and returns a toolResult with the same toolUseId. The loop repeats until stopReason is end_turn and the model answers.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
