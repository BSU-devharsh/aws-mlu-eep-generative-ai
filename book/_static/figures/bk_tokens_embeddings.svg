<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-labelledby="t d"><title id="t">Tokens are for processing text, embeddings are for comparing meaning</title><desc id="d">Two lanes. In the tokens lane, text goes into a tokenizer, which splits it into subword tokens, each mapped to an integer ID from a vocabulary. A large language model reads and writes these tokens, and its context window and billing are counted in tokens. In the embeddings lane, a whole passage goes into an embedding model, which returns one vector of floating-point numbers. The vector is compared with others in a vector index by cosine similarity, which returns the passages closest in meaning.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
