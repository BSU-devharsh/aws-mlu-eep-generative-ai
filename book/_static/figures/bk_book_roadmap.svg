<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 450" width="1180" height="450" role="img" aria-labelledby="t d"><title id="t">How the book is organized, from AI literacy to applications on Amazon Bedrock</title><desc id="d">Five cards run left to right in reading order. The primer covers AI literacy, tools, tokens, and embeddings. Module 1 covers the fundamentals of large language models and prompting. Module 2 covers responsible AI, including evaluation and safety. Module 3 covers applications such as retrieval-augmented generation and agents. Each module ends with labs, which are Jupyter notebooks that send API calls to foundation models on Amazon Bedrock. The appendices cover traditional machine learning and a serverless backend.</desc>
