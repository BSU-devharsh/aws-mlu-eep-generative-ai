<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" width="1180" height="400" role="img" aria-labelledby="t d"><title id="t">Amazon Bedrock puts many foundation models behind one managed API</title><desc id="d">An application on the left sends a request through the AWS SDK to Amazon Bedrock. Inside Bedrock, identity and access management checks who is calling, the data is encrypted, and prompts and responses are not shared with AWS or with the model providers. Bedrock routes the request to a foundation model chosen from several providers, and the response comes back the same way. You can choose a model per task and swap it without rewriting code.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
