<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-labelledby="t d"><title id="t">A model API that resists extraction: return less, count more</title><desc id="d">Behind the API the model produces full scores. The public wrapper returns one label to the caller and logs the full scores internally, so a systematic sweep can be spotted. Each caller has a daily quota, 500 queries in the example; the 501st query from a scraper returns quota exceeded. In production, API Gateway usage plans enforce per-key throttling and quotas, tied to verified customers.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
