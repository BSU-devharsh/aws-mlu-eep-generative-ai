<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img" aria-labelledby="t d"><title id="t">Separating initiation from approval for an AI agent that handles payments</title><desc id="d">The accounts-payable agent has a propose_payment tool and no approve tool; it can only queue a payment as pending approval. Approval runs in a separate service under the approver&#x27;s own credentials, and the harness, not the model, supplies the caller&#x27;s identity. The service checks that the approver is not the initiator, does not share its sponsor, and is a person above 10,000 dollars. Only then is the payment released.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
