<g class="st s1"><rect x="196.0" y="96.0" width="330" height="80" rx="6" fill="url(#g-box)" stroke="#4a6fa5" stroke-width="1.6" filter="url(#f-drop)"/><text x="361.0" y="132.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="bold" text-anchor="middle">Does it contain PII, student</text><text x="361.0" y="150.2" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1f2933" font-weight="normal" text-anchor="middle">records, or health data?</text></g>
<g class="st s1"><circle cx="52" cy="100" r="12" fill="#1f4e9c" stroke="#fff" stroke-width="2"/><text x="52.0" y="104.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text></g>
<g class="st s2"><path d="M526.0 136.0 L676.0 136.0" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#a-2e7d32)" stroke-linejoin="round"/><text x="601.0" y="128.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" font-weight="bold" text-anchor="middle">no</text></g>
<g class="st s2"><rect x="680.0" y="86.0" width="470.0" height="100.0" rx="10" fill="#ffffff" fill-opacity="1" stroke="#2e7d32" stroke-width="2.2"/></g>
<g class="st s2"><rect x="680.0" y="86.0" width="8.0" height="100.0" rx="4" fill="#2e7d32" fill-opacity="1" stroke="#2e7d32" stroke-width="1"/></g>
<g class="st s2"><use href="#i-laptop" x="702.0" y="109.0" width="54" height="54"/></g>
<g class="st s2"><text x="768.0" y="123.8" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#2e7d32" font-weight="bold" text-anchor="start">A consumer tool is acceptable</text></g>
<g class="st s2"><text x="768.0" y="143.8" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">after you opt out of model training</text></g>
<g class="st s2"><text x="768.0" y="160.8" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">in its settings</text></g>
<g class="st s2"><circle cx="1128" cy="86" r="12" fill="#2e7d32" stroke="#fff" stroke-width="2"/><text x="1128.0" y="90.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text></g>
<g class="st s3"><path d="M361.0 176.0 L361.0 316.0 L416.0 316.0" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#a-c0392b)" stroke-linejoin="round"/></g>
<g class="st s3"><text x="374.0" y="250.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="start">yes</text></g>
<g class="st s3"><rect x="420.0" y="266.0" width="330.0" height="100.0" rx="10" fill="#ffffff" fill-opacity="1" stroke="#d9822b" stroke-width="2.2"/></g>
<g class="st s3"><rect x="420.0" y="266.0" width="8.0" height="100.0" rx="4" fill="#d9822b" fill-opacity="1" stroke="#d9822b" stroke-width="1"/></g>
<g class="st s3"><use href="#i-idcard" x="442.0" y="289.0" width="54" height="54"/></g>
<g class="st s3"><text x="508.0" y="303.8" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#d9822b" font-weight="bold" text-anchor="start">De-identify first</text></g>
<g class="st s3"><text x="508.0" y="323.8" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">strip names, IDs,</text></g>
<g class="st s3"><text x="508.0" y="340.8" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">and record numbers</text></g>
<g class="st s3"><circle cx="728" cy="266" r="12" fill="#d9822b" stroke="#fff" stroke-width="2"/><text x="728.0" y="270.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text></g>
<g class="st s4"><path d="M750.0 316.0 L796.0 316.0" fill="none" stroke="#1f2933" stroke-width="2.2" marker-end="url(#a-1f2933)" stroke-linejoin="round"/></g>
<g class="st s4"><rect x="800.0" y="266.0" width="350.0" height="100.0" rx="10" fill="#ffffff" fill-opacity="1" stroke="#6a3d9a" stroke-width="2.2"/></g>
<g class="st s4"><rect x="800.0" y="266.0" width="8.0" height="100.0" rx="4" fill="#6a3d9a" fill-opacity="1" stroke="#6a3d9a" stroke-width="1"/></g>
<g class="st s4"><use href="#i-certificate" x="822.0" y="289.0" width="54" height="54"/></g>
<g class="st s4"><text x="888.0" y="303.8" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6a3d9a" font-weight="bold" text-anchor="start">Use a vetted tool</text></g>
<g class="st s4"><text x="888.0" y="323.8" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">an institutional agreement (FERPA)</text></g>
<g class="st s4"><text x="888.0" y="340.8" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933" font-weight="normal" text-anchor="start">or a signed BAA (HIPAA)</text></g>
<g class="st s4"><circle cx="1128" cy="266" r="12" fill="#6a3d9a" stroke="#fff" stroke-width="2"/><text x="1128.0" y="270.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text></g>
</svg>