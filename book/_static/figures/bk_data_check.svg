<text x="590.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#1f2933" font-weight="bold" text-anchor="middle">Before you paste, check the data against the tool</text>
<g class="st s1"><use href="#i-document" x="52.0" y="108.0" width="56" height="56"/><text x="80.0" y="179.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f2933" font-weight="bold" text-anchor="middle">Your text</text></g>
