<rect x="10" y="22" width="80" height="12" rx="5" fill="#4a6fa5"/><rect x="10" y="29" width="80" height="5" fill="#4a6fa5"/>
<rect x="17" y="40" width="24" height="28" rx="2" fill="#dbe7f5"/>
