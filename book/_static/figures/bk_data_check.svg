<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 390" width="1180" height="390" role="img" aria-labelledby="t d"><title id="t">Before you paste, check the data against the tool</title><desc id="d">A decision flow. Start with the text you want to paste and ask whether it contains personally identifiable information, student records, or health data. If not, a consumer AI tool is acceptable, after you opt out of model training in its settings. If it does, first de-identify the text by stripping names, IDs, and record numbers, and then use only a vetted tool bound by contract, an institutional agreement for student data under FERPA or a signed Business Associate Agreement for health data under HIPAA.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
