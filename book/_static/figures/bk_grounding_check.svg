<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="1180" height="420" role="img" aria-labelledby="t d"><title id="t">Checking that an answer is grounded in its source, and abstaining when it is not</title><desc id="d">A user asks what the fee is, and the source document says the fee is 2 percent. The model drafts an answer that says 3 percent, an intrinsic hallucination because it contradicts the source. A contextual grounding check in Amazon Bedrock Guardrails takes the source, the query, and the response and scores the response for grounding and relevance. If both scores meet the thresholds you set, the answer is returned. If either falls below its threshold, the response is blocked and the system abstains, by declining, asking a clarifying question, or handing off to a person.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
