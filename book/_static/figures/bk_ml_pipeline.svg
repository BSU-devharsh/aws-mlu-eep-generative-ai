<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380" role="img" aria-labelledby="t d"><title id="t">The supervised machine learning pipeline</title><desc id="d">Left to right: raw data in rows and columns; exploratory data analysis to explore and clean; feature engineering to impute, scale, and encode; train the model on the training set; evaluate metrics on the test set; and check fairness for per-group gaps. A dashed loop returns from evaluation to feature engineering when the metrics are poor.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}.s6{animation-delay:4.50s}.s7{animation-delay:5.40s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
