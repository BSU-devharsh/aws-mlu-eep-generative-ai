<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="1180" height="420" role="img" aria-labelledby="t d"><title id="t">A free serverless backend, a Lambda Function URL in front of a DynamoDB table</title><desc id="d">The figure follows the five steps of the appendix. A DynamoDB table named TodoTable with partition key id uses provisioned capacity of 5 read and 5 write units. An IAM role named LambdaTodoRole gives the function table access and CloudWatch logging. A Lambda function named TodoHandler reads and writes the table. A Lambda Function URL with CORS exposes the function over HTTPS; its auth type NONE makes it public, so a real system should use AWS_IAM or API Gateway. A client tests it with curl, sending POST to add a task and GET to list tasks.</desc>
<style>@media (prefers-reduced-motion: no-preference){.st{animation:fig-in .7s ease-out both}.s1{animation-delay:0.00s}.s2{animation-delay:0.90s}.s3{animation-delay:1.80s}.s4{animation-delay:2.70s}.s5{animation-delay:3.60s}}@keyframes fig-in{from{opacity:0}to{opacity:1}}</style>
